<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTC NYC - Facilitator Live Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        .cat-creative { background-color: #065f46; color: #a7f3d0; }
        .cat-results { background-color: #1e40af; color: #bfdbfe; }
        .cat-strategic { background-color: #6b21a8; color: #e9d5ff; }
        .cat-collaborative { background-color: #92400e; color: #fef08a; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6">
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAc_RvEzrj6jsKgmNQlF7n1cbvyZ3ENPmM",
            authDomain: "ctc-nyc-values-sept-2026.firebaseapp.com",
            databaseURL: "https://ctc-nyc-values-sept-2026-default-rtdb.firebaseio.com",
            projectId: "ctc-nyc-values-sept-2026",
            storageBucket: "ctc-nyc-values-sept-2026.firebasestorage.app",
            messagingSenderId: "1059839729307",
            appId: "1:1059839729307:web:43c07cea2f536a0e8ff03e"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
    </script>

    <header class="flex justify-between items-center border-b border-slate-800 pb-4 mb-6">
        <div>
            <h1 class="text-3xl font-extrabold text-indigo-400">CTC NYC Live Facilitator Dashboard</h1>
            <p class="text-slate-400 text-sm">Realtime Sub-Team & Organizational Value Aggregation</p>
        </div>
        <div class="flex items-center gap-4">
            <div class="bg-slate-900 px-4 py-2 rounded-lg border border-slate-800">
                <span class="text-slate-400 text-xs block">Live Submissions</span>
                <span id="total-submissions" class="text-2xl font-bold text-emerald-400">0</span>
            </div>
            <button onclick="clearData()" class="bg-red-900/40 border border-red-700 text-red-300 hover:bg-red-900 text-xs px-3 py-2 rounded">Clear Session</button>
        </div>
    </header>

    <main class="grid grid-cols-1 lg:grid-cols-4 gap-6">
        <!-- Control Panel -->
        <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-4">
            <h2 class="font-bold text-indigo-300">Filter Projection View</h2>
            <select id="team-filter" onchange="updateView()" class="w-full bg-slate-800 border border-slate-700 p-2.5 rounded-lg text-white">
                <option value="ALL">Entire Organization (CTC NYC)</option>
                <option value="Programs">Programs</option>
                <option value="Marketing">Marketing</option>
                <option value="Operations">Operations</option>
                <option value="Fundraising">Fundraising</option>
                <option value="Catalysts">Catalysts</option>
            </select>

            <div class="p-3 bg-slate-950 rounded-lg text-xs space-y-2 border border-slate-800">
                <div class="font-bold text-slate-300">Legend:</div>
                <div class="flex items-center gap-2"><span class="w-3 h-3 rounded bg-emerald-600"></span> Creative Change</div>
                <div class="flex items-center gap-2"><span class="w-3 h-3 rounded bg-blue-600"></span> Robust Results</div>
                <div class="flex items-center gap-2"><span class="w-3 h-3 rounded bg-purple-600"></span> Strategic Structures</div>
                <div class="flex items-center gap-2"><span class="w-3 h-3 rounded bg-amber-600"></span> Collaborative Community</div>
            </div>
        </div>

        <!-- Live Rankings Grid -->
        <div class="lg:col-span-3 bg-slate-900 p-6 rounded-xl border border-slate-800">
            <h2 id="view-title" class="text-xl font-bold text-slate-200 mb-4">Current Leaderboard: Entire Organization</h2>
            <div id="rankings-grid" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
        </div>
    </main>

    <script>
        const valuesData = [
            { id: 1, name: "Growth focus", cat: "cat-creative" },
            { id: 2, name: "Self Organization", cat: "cat-creative" },
            { id: 3, name: "Creative Action", cat: "cat-creative" },
            { id: 4, name: "Intrinsic Motivation", cat: "cat-creative" },
            { id: 5, name: "Positive Contagion (Woo)", cat: "cat-creative" },
            { id: 6, name: "Full Engagement", cat: "cat-results" },
            { id: 7, name: "Individual Accountability", cat: "cat-results" },
            { id: 8, name: "Decisive Action", cat: "cat-results" },
            { id: 9, name: "Achievement Focus", cat: "cat-results" },
            { id: 10, name: "Constructive Confrontation", cat: "cat-results" },
            { id: 11, name: "Cost Control", cat: "cat-strategic" },
            { id: 12, name: "Organizational Predictability", cat: "cat-strategic" },
            { id: 13, name: "Procedural Compliance", cat: "cat-strategic" },
            { id: 14, name: "Managerial Control", cat: "cat-strategic" },
            { id: 15, name: "Objective Analysis", cat: "cat-strategic" },
            { id: 16, name: "Life Balance", cat: "cat-collaborative" },
            { id: 17, name: "Cohesive Teamwork", cat: "cat-collaborative" },
            { id: 18, name: "Group Deliberation", cat: "cat-collaborative" },
            { id: 19, name: "Authentic Relationships", cat: "cat-collaborative" },
            { id: 20, name: "Appreciative Expression", cat: "cat-collaborative" }
        ];

        let allSubmissions = [];

        db.ref('submissions').on('value', snapshot => {
            const data = snapshot.val() || {};
            allSubmissions = Object.values(data);
            document.getElementById('total-submissions').innerText = allSubmissions.length;
            updateView();
        });

        function updateView() {
            const filter = document.getElementById('team-filter').value;
            document.getElementById('view-title').innerText = filter === 'ALL' ? 'Current Leaderboard: Entire Organization' : `Current Leaderboard: ${filter} Team`;

            const filtered = filter === 'ALL' ? allSubmissions : allSubmissions.filter(s => s.team === filter);
            if (!filtered.length) {
                document.getElementById('rankings-grid').innerHTML = '<p class="text-slate-500 col-span-2">No submissions recorded for this selection yet.</p>';
                return;
            }

            let totals = {};
            valuesData.forEach(v => totals[v.id] = 0);
            filtered.forEach(s => s.rankings.forEach(r => totals[r.id] += r.score));

            let sorted = Object.keys(totals).map(id => ({
                id: parseInt(id),
                avgScore: (totals[id] / filtered.length).toFixed(1)
            })).sort((a, b) => b.avgScore - a.avgScore);

            const grid = document.getElementById('rankings-grid');
            grid.innerHTML = '';

            sorted.forEach((item, index) => {
                const val = valuesData.find(v => v.id === item.id);
                grid.innerHTML += `
                    <div class="p-3 rounded-lg border border-slate-700 flex items-center justify-between ${val.cat}">
                        <div class="flex items-center gap-3">
                            <span class="font-bold text-lg">#${index + 1}</span>
                            <span class="font-semibold">${val.name}</span>
                        </div>
                        <span class="text-sm font-mono opacity-90">Score: ${item.avgScore}</span>
                    </div>`;
            });
        }

        function clearData() {
            if (confirm("Are you sure you want to reset all session submissions in Firebase?")) {
                db.ref('submissions').remove();
            }
        }
    </script>
</body>
</html>
